name: Paper 26.2 build

on:
  push:
    branches: ['compat/paper-26.2', 'main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and package
        run: mvn -B -ntp clean verify
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: dynashop-paper-26.2-alpha
          path: target/ShopGUIPlus-DynaShop-*.jar
          if-no-files-found: error
